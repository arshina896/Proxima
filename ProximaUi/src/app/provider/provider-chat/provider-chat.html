<div class="chat-page">

    <!-- Header -->
  <div class="chat-topbar">

    <button class="back-btn" (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
    </button>

    <img
        [src]="booking.profileImage ?
        'https://localhost:7040/' + booking.profileImage :
        'assets/default-user.png'"
        class="profile-image">

    <div class="user-info">

        <h5>{{booking.name}}</h5>

    </div>

</div>

    <!-- Chat Component -->
    <div class="chat-body">

        <app-chat [bookingId]="booking.bookingId" [receiverId]="booking.userId">
        </app-chat>

    </div>

</div>
