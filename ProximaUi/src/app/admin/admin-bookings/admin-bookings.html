<div class="card shadow-sm border-0 mt-4">

    <div class="card-header bg-white">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">

            <h4 class="mb-0">

                <i class="bi bi-calendar-check-fill me-2 text-success"></i>

                Bookings

            </h4>

            <input
                class="form-control w-auto"
                type="text"
                placeholder="Search..."
                [(ngModel)]="search"
                (input)="searchBooking()">

        </div>

    </div>

    <div class="card-body p-0">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0">

                <thead class="table-success">

                    <tr>

                        <th>ID</th>
                        <th>Customer</th>
                        <th>Provider</th>
                        <th>Service</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th class="text-center">Action</th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let booking of filteredBookings">

                        <td>{{booking.id}}</td>

                        <td>{{booking.customer}}</td>

                        <td>{{booking.provider}}</td>

                        <td>{{booking.service}}</td>

                        <td>{{booking.bookingDate | date:'dd-MM-yyyy'}}</td>

                        <td>

                            <span
                                class="badge"
                                [ngClass]="{
                                  'bg-warning text-dark': booking.status=='Pending',
                                  'bg-success': booking.status=='Approved',
                                  'bg-danger': booking.status=='Rejected',
                                  'bg-primary': booking.status=='Completed'
                                }">

                                {{booking.status}}

                            </span>

                        </td>

                        <td class="text-center">

                            <button
                                class="btn btn-danger btn-sm"
                                (click)="deleteBooking(booking.id)">

                                <i class="bi bi-trash"></i>

                            </button>

                        </td>

                    </tr>

                    <tr *ngIf="filteredBookings.length==0">

                        <td colspan="7" class="text-center py-4">

                            No Bookings Found

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
