<div class="container mt-4">

  <h2 class="mb-3">My Bookings</h2>

  <div *ngIf="loading" class="text-center">
    <p>Loading...</p>
  </div>

  <div *ngIf="!loading && bookings.length === 0" class="text-center">
    <p>No bookings found</p>
  </div>

  <div class="row" *ngIf="bookings.length > 0">
    <div class="col-md-4 mb-3" *ngFor="let b of bookings">
      <div class="card shadow p-3">

        <h5>{{ b.serviceName }}</h5>

        <p class="text-muted">
          {{ b.category }}
        </p>

        <p>
          Provider: {{ b.providerName }}
        </p>

        <p>
          Date: {{ b.bookingDate | date:'short' }}
        </p>

        <!-- STATUS BADGE -->
        <span 
          class="badge"
          [ngClass]="{
            'bg-warning': b.status === 'Pending',
            'bg-success': b.status === 'Approved',
            'bg-danger': b.status === 'Rejected'
          }">
          {{ b.status }}
        </span>

      </div>
    </div>
  </div>

</div>
