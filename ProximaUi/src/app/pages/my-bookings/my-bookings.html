<div class="container mt-4">

  <h2 class="mb-3">My Bookings</h2>

  <div *ngIf="loading" class="text-center">
    <p>Loading...</p>
  </div>

  <div *ngIf="!loading && bookings.length === 0" class="text-center">
    <p>No bookings found</p>
  </div>

  <div class="row" *ngIf="bookings.length > 0">
    <div class="col-md-4 mb-3" *ngFor="let b of bookings">
      <div class="card shadow p-3">

        <h5>{{ b.serviceName }}</h5>

        <p class="text-muted">
          {{ b.category }}
        </p>

        <p>
          Provider: {{ b.providerName }}
        </p>

        <p>
          Date: {{ b.bookingDate | date:'short' }}
        </p>

        <!-- STATUS BADGE -->
        <span class="badge" [ngClass]="{
            'bg-warning': b.status === 'Pending',
            'bg-success': b.status === 'Approved',
            'bg-danger': b.status === 'Rejected',
            'bg-primary': b.status === 'Completed',
            'bg-secondary': b.status==='Cancelled'
          }">
          {{ b.status }}
        </span>
        <!-- CANCEL BUTTON -->

        <div *ngIf="b.status=='Completed'" class="mt-3">

          <label>
            Rating
          </label>

          <select class="form-select" [(ngModel)]="rating">

            <option [value]="5">★★★★★</option>

            <option [value]="4">★★★★</option>

            <option [value]="3">★★★</option>

            <option [value]="2">★★</option>

            <option [value]="1">★</option>

          </select>

          <textarea class="form-control mt-2" [(ngModel)]="comment" placeholder="Write review">

</textarea>
          <button class="btn btn-success mt-2" (click)="submitReview(b.id)">

            Submit Review

          </button>

        </div>
        <div class="mt-2">
          <button *ngIf="b.status=='Pending'" class="btn btn-danger btn-sm" (click)="cancelBooking(b.id)">
            Cancel Booking
          </button>

        </div>
      </div>
    </div>
  </div>

</div>
