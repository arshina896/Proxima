<h2>My Bookings</h2>

<div *ngIf="loading">
  <p>Loading...</p>
</div>

<div *ngIf="!loading && bookings.length === 0">
  <p>No bookings found</p>
</div>

<div *ngIf="!loading && bookings.length > 0">
  <div *ngFor="let b of bookings">
    <h3>{{ b.serviceName }}</h3>
    <p>Category: {{ b.category }}</p>
    <p>Provider: {{ b.providerName }}</p>
    <p>Status: {{ b.status }}</p>
   <p>Date: {{ b.bookingDate | date:'short' }}</p>
  </div>
</div>
