<div *ngIf="service; else loading">

    <div class="service-page">

        <div class="image-section">

            <img [src]="'https://localhost:7040/' + service.imageUrl" class="service-image" />

        </div>


        <div class="details-section">

            <span class="category">

                {{service.categoryName}}

            </span>

            <h1>

                {{service.serviceName}}

            </h1>


            <div class="rating">

                ★★★★★
                <span>(4.8)</span>

            </div>


            <div class="provider-card">

                <h4>

                    Provider

                </h4>

                <p>

                    {{service.provider}}

                </p>

                <p>

                    100+ bookings completed

                </p>

                <p>

                    Response Time: ~30 min

                </p>

            </div>


            <h2 class="price">

                ₹{{service.price}}

            </h2>


            <button class="book-btn" (click)="bookService(service.id)">

                Book Now

            </button>


            <div class="desc-box">

                <h3>

                    About Service

                </h3>

                <p>

                    {{service.description}}

                </p>

            </div>

        </div>

    </div>

</div>


<ng-template #loading>

    <div class="loading">

        Loading...

    </div>

</ng-template>
