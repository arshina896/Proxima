<div class="profile-page">

    <div class="container">

        <!-- Header -->

        <div class="profile-header">

            <h2>My Profile</h2>

            <p>Manage your personal information</p>

        </div>

        <!-- Main Card -->

        <div class="profile-card">

            <div class="row">

                <!-- LEFT -->

                <div class="col-lg-4">

                    <div class="left-panel">

                        <div class="image-wrapper">

                            <img *ngIf="imagePreview"
                                 [src]="imagePreview"
                                 class="profile-image">

                            <i *ngIf="!imagePreview"
                               class="bi bi-person-circle default-icon">
                            </i>

                            <label class="camera-btn">

                                <i class="bi bi-camera-fill"></i>

                                <input
                                    type="file"
                                    hidden
                                    (change)="onFileSelected($event)">

                            </label>

                        </div>

                        <h4>

                            {{profile.fullName}}

                        </h4>

                        <p>

                            {{profile.email}}

                        </p>

                    </div>

                </div>

                <!-- RIGHT -->

                <div class="col-lg-8">

                    <div class="right-panel">

                        <h5>

                            Personal Information

                        </h5>

                        <div class="row">

                            <div class="col-md-6">

                                <div class="form-group">

                                    <label>

                                        Full Name

                                    </label>

                                    <input
                                        class="form-control"
                                        [(ngModel)]="profile.fullName">

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="form-group">

                                    <label>

                                        Email

                                    </label>

                                    <input
                                        class="form-control"
                                        [value]="profile.email"
                                        readonly>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="form-group">

                                    <label>

                                        Phone Number

                                    </label>

                                    <input
                                        class="form-control"
                                        [(ngModel)]="profile.phoneNumber">

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="form-group">

                                    <label>

                                        Gender

                                    </label>

                                    <select
                                        class="form-select"
                                        [(ngModel)]="profile.gender">

                                        <option value="Male">

                                            Male

                                        </option>

                                        <option value="Female">

                                            Female

                                        </option>

                                        <option value="Other">

                                            Other

                                        </option>

                                    </select>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="form-group">

                                    <label>

                                        Date Of Birth

                                    </label>

                                    <input
                                        type="date"
                                        class="form-control"
                                        [(ngModel)]="profile.dateOfBirth">

                                </div>

                            </div>

                        </div>

                        <hr>

                        <h5>

                            Address Information

                        </h5>

                        <div class="form-group">

                            <label>

                                Address

                            </label>

                            <textarea
                                rows="3"
                                class="form-control"
                                [(ngModel)]="profile.address">

                            </textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>

                                        City

                                    </label>

                                    <input
                                        class="form-control"
                                        [(ngModel)]="profile.city">

                                </div>

                            </div>

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>

                                        State

                                    </label>

                                    <input
                                        class="form-control"
                                        [(ngModel)]="profile.state">

                                </div>

                            </div>

                            <div class="col-md-4">

                                <div class="form-group">

                                    <label>

                                        Pincode

                                    </label>

                                    <input
                                        class="form-control"
                                        [(ngModel)]="profile.pincode">

                                </div>

                            </div>

                        </div>

                        <hr>

                        <h5>

                            About Me

                        </h5>

                        <textarea
                            rows="5"
                            class="form-control"
                            [(ngModel)]="profile.about">

                        </textarea>

                        <button
                            class="btn btn-primary save-btn"
                            (click)="saveProfile()">

                            <i class="bi bi-check-circle"></i>

                            Save Changes

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
