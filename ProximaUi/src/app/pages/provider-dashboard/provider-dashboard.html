<h2>Service Provider Dashboard</h2>
<input [(ngModel)]="serviceName" placeholder="Service Name">

<input [(ngModel)]="price" type="number" placeholder="Price">

<select [(ngModel)]="categoryId">
  <option value="">Select Category</option>
  <option *ngFor="let c of categories" [value]="c.id">
    {{ c.categoryName }}
  </option>
</select>

<button (click)="createService()">Create</button>


<hr>
<h2>Your Services</h2>

<table border="1">
  <tr>
    <th>Category</th>
    <th>Service Name</th>
    <th>Price</th>
  </tr>

  <tr *ngFor="let s of services">
    <td>{{ s.categoryName }}</td>
    <td>{{ s.serviceName }}</td>
    <td>{{ s.price }}</td>
  </tr>
</table>



<hr>
<table border="1">
  <tr>
    <th>Service</th>
    <th>Customer</th>
    <th>Date</th>
    <th>Status</th>
    <th>Action</th>
  </tr>

  <tr *ngFor="let b of bookings">
    <td>{{ b.serviceName }}</td>
    <td>{{ b.customerName }}</td>
    <td>{{ b.bookingDate }}</td>
    <td>{{ b.status }}</td>
    <td>
      <button (click)="updateStatus(b.id, 'Approved')">Approve</button>
      <button (click)="updateStatus(b.id, 'Rejected')">Reject</button>
    </td>
  </tr>
</table>
