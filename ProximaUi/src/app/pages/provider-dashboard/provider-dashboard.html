<h2>Provider Dashboard</h2>

<div *ngFor="let b of bookings">
  <h3>{{ b.serviceName }}</h3>
  <p>Customer: {{ b.customerName }}</p>
  <p>Status: {{ b.status }}</p>
  <p>Date: {{ b.bookingDate | date:'short' }}</p>

  <button (click)="updateStatus(b.id, 'Accepted')">Accept</button>
  <button (click)="updateStatus(b.id, 'Rejected')">Reject</button>

  <hr>
</div>
