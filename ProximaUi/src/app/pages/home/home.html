<div class="container mt-4">
  <div class="row mb-4">
    <!-- SEARCH -->
    <div class="col-md-3">
      <input class="form-control" [(ngModel)]="search" placeholder="Search">
    </div>
    <!-- CATEGORY -->
    <div class="col-md-3">
      <select class="form-select" [(ngModel)]="categoryId">
        <option value="0">All Categories</option>

        <option *ngFor="let c of categories" [value]="c.id">

          {{c.categoryName}}

        </option>

      </select>

    </div>

    <!-- SORT -->
    <div class="col-md-2">
      <select class="form-select" [(ngModel)]="sort">
        <option value=""> Sort</option>
        <option value="price"> Price ↑ </option>
        <option value="rating">Rating ⭐</option>
      </select>
    </div>

    <!-- SEARCH BUTTON -->
    <div class="col-md-2">

      <button class="btn btn-primary" (click)="searchService()">

        Search

      </button>

    </div>

    <!-- RESET -->
    <div class="col-md-2">

      <button class="btn btn-secondary" (click)="resetFilter()">

        Reset

      </button>

    </div>

  </div>
  <h2 class="mb-3">Service Providers</h2>

  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let p of providers">
      <div class="card shadow p-3">

        <h5>{{ p.providerName }}</h5>
        <p class="text-warning">

          ⭐
          {{p.averageRating}}

          (
          {{p.totalReviews}}
          reviews)

        </p>
        <div *ngFor="let s of p.services" class="border p-2 mb-2">

          <p>{{ s.serviceName }}</p>

          <p>₹{{ s.price }}</p>

          <!-- DATE -->
          <input type="date" class="form-control mb-2" [(ngModel)]="s.serviceDate">

          <input type="time" class="form-control mb-2" [(ngModel)]="s.timeSlot">

          <button class="btn btn-primary" (click)="bookingService(
s,
s.serviceDate,
s.timeSlot
)">
            Book Now
          </button>

        </div>

      </div>
    </div>
  </div>

  <hr>

  <a routerLink="/services" class="btn btn-outline-primary me-2">
    View Services
  </a>

  <a routerLink="/my-bookings" class="btn btn-outline-success me-2">
    My Bookings
  </a>
<hr>

<div class="dropdown d-inline-block me-2">

<button
class="btn btn-warning dropdown-toggle"
data-bs-toggle="dropdown">

🔔 {{notifications.length}}

</button>

<ul class="dropdown-menu">

<li *ngIf="notifications.length==0">

<div class="dropdown-item">

No Notifications

</div>

</li>

<li *ngFor="let n of notifications">

<div class="dropdown-item">

{{n.message}}

<br>

<small>

{{n.createdAt | date:'short'}}

</small>

</div>

</li>

</ul>

</div>

</div>
