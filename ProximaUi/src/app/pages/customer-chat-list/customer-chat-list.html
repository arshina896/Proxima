<div class="chat-list-container">

    <div class="chat-header">

        <h3>Chats</h3>

    </div>

    <div
        class="chat-item"
        *ngFor="let chat of chats"
        (click)="openChat(chat)">

        <!-- Profile -->

        <div class="profile-wrapper">

            <img
                [src]="chat.profileImage
                ? 'https://localhost:7040/' + chat.profileImage
                : 'assets/images/user.png'"
                class="profile-img">

        </div>

        <!-- Name + Message -->

        <div class="chat-content">

            <div class="chat-top">

                <h6>

                    {{chat.name}}

                </h6>

                <small>

                    {{chat.lastMessageTime | date:'shortTime'}}

                </small>

            </div>

            <div class="chat-bottom">

                <p>

                    {{chat.lastMessage}}

                </p>

                <span
                    class="badge"
                    *ngIf="chat.unreadCount>0">

                    {{chat.unreadCount}}

                </span>

            </div>

        </div>

    </div>

</div>
