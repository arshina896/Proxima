<section class="container my-5 provider-section">

    <!-- Section Heading -->
    <div class="section-header text-center mb-5">

        <span class="section-tag">
            OUR PROFESSIONALS
        </span>

        <h2 class="section-title">
            Explore Service Providers
        </h2>

        <p class="section-subtitle">
            Trusted professionals ready to help you with quality home services.
        </p>

    </div>

    <!-- Provider Cards -->
    <div class="row g-4">

        <div class="col-xl-3 col-lg-4 col-md-6 col-sm-6" *ngFor="let provider of providers">

            <div class="provider-card">

                <!-- Image -->
                <div class="provider-image-wrapper">

                    <img
                        *ngIf="provider.profileImage"
                        [src]="'https://localhost:7040/' + provider.profileImage"
                        class="provider-img"
                        alt="Provider">

                    <i
                        *ngIf="!provider.profileImage"
                        class="bi bi-person-circle provider-icon">
                    </i>

                </div>

                <!-- Details -->
                <div class="provider-body">

                    <h4 class="provider-name">
                        {{provider.fullName}}
                    </h4>

                    <p class="provider-role">
                        Home Service Provider
                    </p>

                    <button
                        class="profile-btn"
                        [routerLink]="['/provider', provider.id]">

                        View Profile

                        <i class="bi bi-arrow-right ms-2"></i>

                    </button>

                </div>

            </div>

        </div>

    </div>

</section>
